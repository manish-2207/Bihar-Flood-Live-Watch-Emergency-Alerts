<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>

  <!-- Radar pulse ring -->
  <circle cx="256" cy="180" r="90" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="180" r="60" fill="none" stroke="#ef4444" stroke-width="6" opacity="0.6"/>

  <!-- Emergency Beacon Pin -->
  <path d="M 256,110 C 220,110 190,140 190,176 C 190,225 256,275 256,275 C 256,275 322,225 322,176 C 322,140 292,110 256,110 Z" fill="url(#alertGrad)"/>
  <circle cx="256" cy="170" r="22" fill="#ffffff"/>

  <!-- River Surge Waves -->
  <path d="M 64,340 C 130,310 180,360 256,335 C 330,310 380,360 448,340 L 448,430 C 380,450 330,400 256,425 C 180,450 130,400 64,430 Z" fill="url(#waveGrad)" opacity="0.95"/>
  <path d="M 64,390 C 130,360 180,410 256,385 C 330,360 380,410 448,390 L 448,448 C 380,448 330,448 256,448 C 180,448 130,448 64,448 Z" fill="#0284c7" opacity="0.75"/>
</svg>
